<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>拼多多 AI 运营助手</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/pages.css" />
  <link rel="stylesheet" href="/static/css/diagnosis.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-nav="dashboard">
        <span class="brand-mark">P</span>
        <span><strong>拼多多 AI 运营助手</strong><small>本地运营工作台</small></span>
      </a>
      <nav class="nav-list">
        <button class="nav-item active" data-nav="dashboard">经营总览</button>
        <button class="nav-item" data-nav="skus">SKU 诊断</button>
        <button class="nav-item" data-nav="data">数据中心</button>
        <button class="nav-item" data-nav="studio">AI 工作台</button>
        <button class="nav-item" data-nav="settings">设置</button>
      </nav>
      <div class="sidebar-foot">
        <span class="local-badge">● 数据保存在本机</span>
        <span id="service-status" class="service-status">正在检查服务…</span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div><p id="page-kicker" class="page-kicker">店铺经营</p><h1 id="page-title">经营总览</h1></div>
        <div class="topbar-actions">
          <span id="global-sync-status" class="status-pill neutral">读取同步状态</span>
          <label class="shop-switcher">当前店铺 <select id="shop-select"></select></label>
          <button class="button secondary" data-nav="data">数据中心</button>
        </div>
      </header>

      <section id="page-dashboard" class="page active"><div id="dashboard-content" class="page-content"></div></section>
      <section id="page-skus" class="page"><div id="skus-content" class="page-content"></div></section>
      <section id="page-data" class="page"><div id="data-content" class="page-content"></div></section>
      <section id="page-studio" class="page"><div id="studio-content" class="page-content"></div></section>
      <section id="page-settings" class="page"><div id="settings-content" class="page-content"></div></section>
    </main>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
  <aside id="sku-drawer" class="drawer" aria-hidden="true">
    <header class="drawer-head"><div><p class="section-kicker">SKU DETAIL</p><h2 id="drawer-title">SKU 详情</h2></div><button id="close-drawer" class="icon-button">×</button></header>
    <div id="drawer-content" class="drawer-content"></div>
  </aside>

  <div id="onboarding" class="modal-backdrop hidden">
    <section class="modal onboarding-modal">
      <aside class="onboarding-side">
        <span class="brand-mark large">P</span><h2>三步开始使用</h2>
        <ol><li data-wizard-indicator="1" class="active">1. 创建店铺</li><li data-wizard-indicator="2">2. 配置 AI</li><li data-wizard-indicator="3">3. 准备数据</li></ol>
      </aside>
      <div id="onboarding-main" class="onboarding-main"></div>
    </section>
  </div>

  <div id="toast-stack" class="toast-stack"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
